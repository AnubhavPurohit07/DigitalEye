server.port=9090
spring.application.name=digitaleye-backend

# JWT signing secret. For local development the built-in default is fine.
# For anything real, set your own value in the JWT_SECRET environment variable
# (at least 32 characters) instead of editing this file.
jwt.secret=${JWT_SECRET:digitaleye-local-dev-secret-change-me-before-real-use-0123456789}
jwt.expiration-ms=86400000

# Folder (relative to digitaleye-backend) where screenshot images are saved.
# screenshot.storage-dir=screenshots

# ---------------------------------------------------------------------------
# Optional activity-classification settings (see the README). All can stay unset.
# ---------------------------------------------------------------------------
# Words that mean "our own website or tool": always Productive.
#classification.company-keywords=yourcompany,intranet.yourcompany.com
# Words that are never allowed: always Non-Productive.
#classification.blocked-keywords=
# Category for a program / website no rule recognises (OTHER, NON_PRODUCTIVE, PRODUCTIVE ...).
#classification.unknown-app=OTHER
#classification.unknown-page=OTHER
# Category for an AI tool whose window title does not say what it is used for.
#classification.ai-unclear=PRODUCTIVE
