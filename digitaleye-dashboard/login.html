<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalEye &mdash; Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
    <div class="login-card">
        <div class="login-brand">
            <div class="logo">&#128065;</div>
            <div class="name">DigitalEye</div>
        </div>
        <p class="login-tag">Monitor &middot; Analyze &middot; Empower</p>

        <div id="loginError" class="login-error"></div>

        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>

        <p class="login-footnote">Administrator access only &mdash; sign in with the account created via /api/auth/register.</p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
    // If already logged in as admin, skip straight to the dashboard.
    (function () {
        const session = getSession();
        if (session && session.token && session.role === "ADMIN") {
            window.location.href = "dashboard.html";
        }
    })();

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorBox.style.display = "none";
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const authResponse = await loginRequest(username, password);

            if (authResponse.role !== "ADMIN") {
                throw new Error("This account isn't an administrator. The dashboard in this milestone is admin-only.");
            }

            saveSession(authResponse);
            window.location.href = "dashboard.html";
        } catch (err) {
            errorBox.textContent = err.message || "Something went wrong. Is the backend running on " + API_BASE_URL + "?";
            errorBox.style.display = "block";
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign in";
        }
    });
</script>
</body>
</html>
